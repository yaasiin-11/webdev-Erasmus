services:
  - type: web
    name: webdev-studyhub
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SEED_DEMO
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MODEL_NAME
        value: gemini-2.5-flash-lite
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
